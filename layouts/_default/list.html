{{ define "main" }}
  {{/* Minimal list page: no title/breadcrumbs/year-grouping, just
       every page in this section as cards, matching the homepage. */}}
  <section class="w-full grid gap-4 sm:grid-cols-2 md:grid-cols-3">
    {{ range .Pages }}
      {{ partial "article-link/card.html" . }}
    {{ end }}
  </section>
{{ end }}
