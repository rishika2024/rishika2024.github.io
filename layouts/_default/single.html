{{ define "main" }}

{{ if .Params.math }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]});"></script>
{{ end }}

<style>
  #content img {
    display: block;
    margin: 1.5rem auto;
    max-width: 100%;
    height: auto;
  }
  article {
    padding-left: 1rem !important;
    padding-right: 1rem !important;
    padding-top: 1rem !important;
    padding-bottom: 1rem !important;
  }
  @media (min-width: 640px) {
    article {
      padding-left: 1.5rem !important;
      padding-right: 1.5rem !important;
      padding-top: 2rem !important;
      padding-bottom: 2rem !important;
    }
  }
  @media (min-width: 768px) {
    article {
      padding-left: 3rem !important;
      padding-right: 3rem !important;
      padding-top: 3rem !important;
      padding-bottom: 3rem !important;
    }
  }
  @media (min-width: 1024px) {
    article {
      padding-left: 8rem !important;
      padding-right: 8rem !important;
      padding-top: 4rem !important;
      padding-bottom: 4rem !important;
    }
  }
  @media (min-width: 1280px) {
    article {
      padding-left: 16rem !important;
      padding-right: 16rem !important;
    }
  }
  #content h1 {
    font-size: 2rem;
    font-weight: 700;
    margin-top: 1rem;
    margin-bottom: 1rem;
    text-align: center;
    line-height: 1.2;
  }
  @media (min-width: 640px) {
    #content h1 {
      font-size: 2.5rem;
      margin-top: 1.5rem;
      margin-bottom: 1.5rem;
    }
  }
  @media (min-width: 1024px) {
    #content h1 {
      font-size: 3.5rem;
      margin-top: 2rem;
      margin-bottom: 2rem;
    }
  }
  #content h2 {
    font-size: 1.25rem;
    font-weight: 600;
    margin-top: 1.5rem;
    margin-bottom: 0.75rem;
  }
  @media (min-width: 1024px) {
    #content h2 {
      font-size: 1.5rem;
      margin-top: 2rem;
      margin-bottom: 1rem;
    }
  }
  #content h3 {
    font-size: 1.125rem;
    font-weight: 600;
    margin-top: 1rem;
    margin-bottom: 0.5rem;
  }
  @media (min-width: 1024px) {
    #content h3 {
      font-size: 1.25rem;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
    }
  }
  #content h4, #content h5, #content h6 {
    font-size: 1rem;
    font-weight: 600;
    margin-top: 0.75rem;
    margin-bottom: 0.5rem;
  }
  @media (min-width: 1024px) {
    #content h4, #content h5, #content h6 {
      font-size: 1.125rem;
      margin-top: 1rem;
    }
  }
  #content p, #content li, #content a {
    font-size: 1rem;
    line-height: 1.6;
  }
  @media (min-width: 768px) {
    #content p, #content li, #content a {
      font-size: 1.0625rem;
      line-height: 1.7;
    }
  }
  @media (min-width: 1024px) {
    #content p, #content li, #content a {
      font-size: 1.125rem;
      line-height: 1.8;
    }
  }
  #content ul, #content ol {
    margin-left: 1rem;
    margin-top: 0.75rem;
    margin-bottom: 0.75rem;
  }
  @media (min-width: 768px) {
    #content ul, #content ol {
      margin-left: 1.25rem;
      margin-top: 1rem;
      margin-bottom: 1rem;
    }
  }
  @media (min-width: 1024px) {
    #content ul, #content ol {
      margin-left: 1.5rem;
    }
  }
</style>

<div class="flex justify-center w-full">
  <article class="md:col-span-2 w-full mx-auto py-16">
    {{ with .Params.github }}
    <div id="github-link" style="text-align:center; margin-bottom:1.5rem; display:none;">
      <a href="{{ . }}" target="_blank" rel="noopener" style="display:inline-flex; align-items:center; gap:0.4rem; font-size:1rem; color:#333; text-decoration:none;">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
        GitHub
      </a>
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var link = document.getElementById('github-link');
        var h1 = document.querySelector('#content h1');
        if (link && h1) {
          link.style.display = 'block';
          h1.insertAdjacentElement('afterend', link);
        }
      });
    </script>
    {{ end }}
    <div id="content" class="mb-32 text-justify leading-relaxed text-lg">
      {{- .Content -}}
    </div>

    <footer id="content-footer" class="not-prose">
    </footer>
  </article>
</div>

{{ end }}
