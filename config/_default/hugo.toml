baseURL = "https://rishika2024.github.io"
languageCode = "en-us"
defaultContentLanguage = "en"
theme = "blowfish"

enableRobotsTXT = true
summaryLength = 30

buildDrafts = false
buildFuture = false

enableEmoji = true

# Allow raw HTML in Markdown (needed for inline grids/HTML blocks used in project posts)
ignoreLogs = ["warning-goldmark-raw-html"]

[pagination]
  pagerSize = 12

[imaging]
  anchor = "Center"

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = "always"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "date"
        weight = 10

[module]
  [module.hugoVersion]
    extended = true
    min = "0.135.0"

[caches]
  [caches.images]
    dir = ":cacheDir/images"
